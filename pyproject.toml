[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcostguard"
version = "0.1.0"
description = "AWS Cost & Waste Scanner CLI"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "moto>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["cloudcostguard"]

[tool.setuptools.entry-points]
console_scripts = [
    "cloudcostguard=cloudcostguard.cli:run",
]